name: NIGHTMARE FORGE / Forge AI Studio CI

on:
  push:
    branches: [ main, master, 'stabilize/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  project-frontend-and-server:
    name: Project (Web, Server & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies (npm ci)
        run: npm ci

      - name: Root TypeScript Typecheck & Lint
        run: npm run lint

      - name: Run Project Automated Test Suite
        run: node --import tsx --test tests/*.test.ts

      - name: Build Production Frontend Bundle
        run: npm run build

  forge-bridge:
    name: Forge Local Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: forge-bridge/package-lock.json

      - name: Install Bridge Dependencies (npm ci)
        run: npm --prefix forge-bridge ci

      - name: Bridge Typecheck & Build
        run: |
          npm --prefix forge-bridge run typecheck
          npm --prefix forge-bridge run build

      - name: Run Bridge Automated Tests
        run: npm --prefix forge-bridge test

  python-backend:
    name: Python Backend & Cross-Language Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (for TS parity checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Root & Python Dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Syntax & Bytecode Compile Check
        run: python -m py_compile backend/main.py backend/engines/*.py tests/test_e2e_bidirectional_sync.py

      - name: Python Backend Security & E2E Bidirectional Sync Tests
        run: python tests/test_e2e_bidirectional_sync.py

  roblox-plugin-checks:
    name: Roblox Studio Luau Plugin & EditableMesh Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies (npm ci)
        run: npm ci

      - name: Verify Luau Strict Mode & Required Studio Handlers
        run: |
          set -euo pipefail
          head -n 1 backend/roblox_plugin/ForgeAIStudioPlugin.server.luau | grep -q "^--!strict"
          grep -q "studio.reconstruct_model" backend/roblox_plugin/ForgeAIStudioPlugin.server.luau
          grep -q "studio.apply_modifications" backend/roblox_plugin/ForgeAIStudioPlugin.server.luau
          grep -q "runForgePluginSelfVerification" backend/roblox_plugin/ForgeAIStudioPlugin.server.luau

      - name: Run EditableMesh, Triangulation & Receipt Contract Tests
        run: node --import tsx --test tests/robloxGeometryValidator.test.ts tests/forgeContext.test.ts tests/canonicalHash.test.ts

  integration-e2e:
    name: Integration (Security, Bridge, Procedural & Persistence)
    runs-on: ubuntu-latest
    needs: [project-frontend-and-server, forge-bridge]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            forge-bridge/package-lock.json

      - name: Install Root & Bridge Dependencies
        run: |
          npm ci
          npm --prefix forge-bridge ci

      - name: Run Full Combined Test Suite (Root + Bridge E2E)
        run: npm test
